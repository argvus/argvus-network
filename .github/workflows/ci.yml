name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate package sources
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          pacman -Syu --noconfirm --needed             base-devel             git             shellcheck             sudo

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          make validate

      - name: Validate CI PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          cd "packaging/arch/ci"
          makepkg -p PKGBUILD --printsrcinfo >/dev/null

      - name: Validate local PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          test -f "packaging/arch/local/PKGBUILD"

      - name: Build local package
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder env HOME=/home/builder make build

      - name: Lint built package
        shell: bash
        run: |
          set -euo pipefail
          namcap build/dist/*.pkg.tar.zst
